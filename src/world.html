<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>%TITLE%</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:%BG%;font-family:system-ui,sans-serif;color:#eee;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
#hud{position:fixed;top:12px;right:14px;font-size:16px;line-height:1.5;text-align:right;text-shadow:0 2px 4px #000a;font-weight:600}
#hud .k{font-size:12px;opacity:.65;font-weight:400}
#toast{position:fixed;top:44%;left:50%;transform:translate(-50%,-50%);font-size:20px;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#prompt{position:fixed;left:50%;top:60%;transform:translateX(-50%);font-size:17px;color:#ddd;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff8}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;color:#d33;text-align:center}
#start{position:fixed;inset:0;overflow-y:auto;touch-action:pan-y;background:#121314d9;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:16px}
#start h1{font-size:44px;margin:0 0 6px;letter-spacing:6px;font-weight:300}
#start p{max-width:560px;opacity:.85;line-height:1.5}
.b{background:#c9a43a;color:#111;border:0;padding:12px 32px;font-size:18px;border-radius:4px;margin:6px;cursor:pointer}
.b2{background:#444;color:#eee}
#note{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:20}
#note p{background:#e8e0c8;color:#2a2418;max-width:460px;padding:26px 30px;font:17px/1.6 Georgia,serif;box-shadow:0 10px 40px #000;transform:rotate(-1deg)}
#touch{display:none}
.tb{position:fixed;width:62px;height:62px;border-radius:50%;background:#0005;border:2px solid #fff6;color:#fff;font-size:22px}
#joy{position:fixed;left:30px;bottom:30px;width:120px;height:120px;border-radius:50%;background:#0003;border:2px solid #fff4}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#fff6}
</style></head><body>
<div id="hud">%HUD%<div class="k">ключи от ворот: <span id="f_keys">0/14</span></div></div>
<div id="cross"></div><div id="toast"></div><div id="prompt"></div><div id="note"><p></p></div>
<div id="touch"><div id="joy"><div id="knob"></div></div><button class="tb" id="tRun" style="right:30px;bottom:110px">🏃</button><button class="tb" id="tJump" style="right:30px;bottom:30px">⤒</button><button class="tb" id="tLight" style="right:110px;bottom:30px;%LIGHT%">🔦</button><button class="tb" id="tE" style="right:110px;bottom:110px;display:none">E</button></div>
<div id="fade"></div>
<div id="start"><h1>%H1%</h1>
%TEXT%
<p style="font-size:13px;opacity:.6">WASD — ходьба, мышь — обзор, E — действие, Shift — бег%KEYS%</p>
<div><button class="b" id="play" disabled>Загрузка…</button><button class="b b2" id="back">← Меню</button></div></div>
<script>window.WORLD="%WORLD%";</script>
<!--THREE-->
<!--GAME-->
</body></html>
