<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Тишина</title>
<style>
/* Меню «Тишина». Всё «дорогое» (размытие, градиенты) нарисовано заранее или статично; анимируются только transform и opacity. */
:root{--a1:#ff7a59;--a2:#7b5cff;--ink:#f2eee6;--dim:rgba(242,238,230,.62);--ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.2,.9,.25,1.2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#07070a;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.bgl{position:fixed;inset:-4%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.1s ease;animation:kb 28s ease-in-out infinite alternate;will-change:transform,opacity}
.bgl.on{opacity:1}
@keyframes kb{from{transform:scale(1.08) translate3d(-1.5%,-1%,0)}to{transform:scale(1.18) translate3d(1.5%,1%,0)}}
.tint{position:fixed;inset:0;opacity:0;transition:opacity 1.1s ease;will-change:opacity}
.tint.on{opacity:1}
#shade{position:fixed;inset:0;background:linear-gradient(90deg,rgba(5,5,8,.88) 0%,rgba(5,5,8,.55) 42%,rgba(5,5,8,.1) 75%),linear-gradient(0deg,rgba(5,5,8,.92) 0%,rgba(5,5,8,0) 42%)}
#grain{position:fixed;inset:0;width:100%;height:100%;opacity:.045;pointer-events:none}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
/* верхняя панель */
#top{display:flex;align-items:center;gap:14px;padding-left:132px;min-height:34px;animation:up .9s var(--ease) both}
.logo{font-weight:200;letter-spacing:.5em;font-size:clamp(13px,2.4vh,17px)}
.logo span{display:block;font-size:9px;letter-spacing:.35em;color:var(--dim);margin-top:2px}
.prog{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:11px;letter-spacing:.12em;color:var(--dim)}
.bar{width:clamp(60px,14vw,150px);height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd35a,var(--a1),var(--a2));transform-origin:left;transform:scaleX(0);transition:transform 1.2s var(--ease) .4s}
#far{font:600 10px system-ui;letter-spacing:.18em;color:var(--dim);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:7px 12px;cursor:pointer;transition:transform .25s var(--spring),background .3s,color .3s}
#far.on{color:#fff;background:linear-gradient(90deg,#ff6a3d,#c22a6a);border-color:transparent}
#far:active,#go:active{transform:scale(.93)}
/* герой: выбранный мир */
#hero{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:min(560px,58vw);padding:6px 0}
#hero>*{animation:in .7s var(--ease) both}
#hero.swap>*{animation:none}
#hnum{font-size:11px;letter-spacing:.3em;color:var(--dim);animation-delay:.05s}
#hnum b{color:var(--ink);font-weight:600}
#htag{display:inline-block;align-self:flex-start;margin-top:10px;font:700 10px system-ui;letter-spacing:.25em;padding:5px 10px;border-radius:4px;background:linear-gradient(90deg,var(--a1),var(--a2));color:#fff;animation-delay:.1s}
#htag:empty{display:none}
#hname{margin-top:6px;font-weight:200;font-size:clamp(34px,10vh,86px);letter-spacing:.12em;line-height:1.02;background:linear-gradient(95deg,#fff 10%,var(--a1) 55%,var(--a2) 95%);-webkit-background-clip:text;background-clip:text;color:transparent;animation-delay:.12s;padding-bottom:4px}
#hdesc{margin-top:8px;font-size:clamp(12px,2.3vh,15px);line-height:1.55;color:var(--dim);max-width:46ch;animation-delay:.2s}
#hstat{margin-top:8px;font-size:13px;color:#ffd35a;letter-spacing:.06em;min-height:1.2em;animation-delay:.25s}
#go{align-self:flex-start;margin-top:14px;display:flex;align-items:center;gap:12px;font:600 13px system-ui;letter-spacing:.3em;color:#fff;border:0;border-radius:40px;padding:13px 26px 13px 28px;cursor:pointer;
  background:linear-gradient(95deg,var(--a1),var(--a2));box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .3s var(--spring);animation-delay:.3s}
#go b{display:inline-block;transition:transform .3s var(--spring)}
#go:hover b{transform:translateX(5px)}
@keyframes in{from{opacity:0;transform:translate3d(-22px,0,0)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translate3d(0,-14px,0)}to{opacity:1;transform:none}}
/* лента миров */
#strip{display:flex;gap:10px;overflow-x:auto;overflow-y:visible;scroll-snap-type:x proximity;padding:18px 14px 8px;margin:0 -14px;scroll-padding:0 14px;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}
#strip::-webkit-scrollbar{display:none}
.t{position:relative;flex:0 0 auto;width:clamp(104px,15vw,168px);aspect-ratio:16/10;border-radius:12px;scroll-snap-align:center;cursor:pointer;
  transform:translate3d(0,0,0) scale(1);transition:transform .45s var(--spring),opacity .4s;opacity:.62;animation:tin .8s var(--ease) both}
@keyframes tin{from{opacity:0;transform:translate3d(0,30px,0)}}
.t .im{position:absolute;inset:0;border-radius:12px;background-size:cover;background-position:center;background-color:#1a1a20;overflow:hidden}
.t .im::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,0) 60%)}
.t .nm{position:absolute;left:9px;right:6px;bottom:7px;font:600 10.5px system-ui;letter-spacing:.16em;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .ix{position:absolute;left:9px;top:6px;font-size:9px;letter-spacing:.15em;color:rgba(255,255,255,.6);z-index:2}
.t::before{content:"";position:absolute;inset:-2px;border-radius:14px;background:linear-gradient(135deg,var(--b1),var(--b2));opacity:0;transition:opacity .35s}
.t::after{content:"";position:absolute;inset:-14px;border-radius:24px;background:radial-gradient(closest-side,var(--b1),transparent);opacity:0;transition:opacity .45s;z-index:-1}
.t.sel{opacity:1;transform:translate3d(0,-8px,0) scale(1.1)}
.t.sel::before{opacity:1}.t.sel::after{opacity:.55}
.t:active{transform:translate3d(0,-4px,0) scale(1.02)}
#hint{font-size:10px;letter-spacing:.14em;color:rgba(255,255,255,.35);text-align:center;margin-top:6px}
/* вход в мир */
#cover{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .55s ease}
body.go #cover{opacity:1;transition-delay:.55s}
body.go .bgl.on{transition:transform 1.2s var(--ease),opacity 1s;transform:scale(1.35)!important;animation:none}
body.go #hero{transition:transform .7s var(--ease),opacity .5s;transform:translate3d(-40px,0,0);opacity:0}
body.go #strip,body.go #hint,body.go #top{transition:transform .6s var(--ease),opacity .4s;transform:translate3d(0,40px,0);opacity:0}
body.go #top{transform:translate3d(0,-30px,0)}
#big{position:fixed;left:0;right:0;top:50%;text-align:center;font-weight:200;font-size:clamp(34px,11vw,110px);letter-spacing:.3em;text-indent:.3em;pointer-events:none;opacity:0;transform:translate3d(0,-50%,0) scale(.85);
  background:linear-gradient(90deg,#fff,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;transition:opacity .6s ease .15s,transform 1.1s var(--ease) .15s}
body.go #big{opacity:1;transform:translate3d(0,-50%,0) scale(1)}
/* кнопка музыки (её добавляет music.js) */
body>button[style*="z-index:99"]{background:rgba(255,255,255,.06)!important;border:1px solid rgba(255,255,255,.14)!important;border-radius:20px!important;padding:7px 12px!important;font:600 10px system-ui!important;letter-spacing:.12em;top:max(12px,env(safe-area-inset-top))!important;left:max(16px,env(safe-area-inset-left))!important}
@media (max-height:420px){#hdesc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}#go{padding:10px 20px;margin-top:10px}#hint{display:none}#strip{padding-top:12px}}
@media (max-aspect-ratio:1/1){#hero{max-width:100%;justify-content:flex-end;padding-bottom:10px}#shade{background:linear-gradient(0deg,rgba(5,5,8,.95) 0%,rgba(5,5,8,.6) 55%,rgba(5,5,8,.2) 100%)}#top{padding-left:0;flex-wrap:wrap;padding-top:40px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="bgl" id="bgA"></div><div class="bgl" id="bgB"></div><div class="tint" id="tA"></div><div class="tint" id="tB"></div><div id="shade"></div><canvas id="grain" width="640" height="360"></canvas>
<div id="ui">
  <header id="top"><div class="logo">ТИШИНА<span>ОДИН СОН · 16 МИРОВ</span></div><div class="prog"><div class="bar"><i id="pbar"></i></div><span id="ptxt"></span></div><button id="far"></button></header>
  <section id="hero"><div id="hnum"></div><div id="htag"></div><h1 id="hname"></h1><p id="hdesc"></p><div id="hstat"></div><button id="go">ВОЙТИ <b>→</b></button></section>
  <nav id="strip"></nav><div id="hint">← → выбрать · Enter — войти</div>
</div>
<div id="big"></div><div id="cover"></div>
<!--MUSIC-->
<script>
const IMG = /*THUMBS*/{}, BLUR = /*BLUR*/{};
const its = (w, ic) => () => { const n = +ls(w + '_items') || 0; return n ? `${ic} ${n}` : ''; };
const WORLDS = [
  { id: 'dvory', name: 'ДВОРЫ', tag: 'СЮЖЕТ', desc: '415-й микрорайон, Героев Тулы, 13. Ноябрь, 14:50, после дождя. Ключа нет, домофон молчит. Главная история.', stat: () => { const c = Math.min(12, +ls('dvory_cards') || 0), m = +ls('dvory_mand') || 0; return (c ? `✉ ${c}/12 ` : '') + (m ? `🌰 ${m}` : ''); } },
  { id: 'tishina', name: 'ТИШИНА', desc: 'Волга, осень, костёр. Горы, лес, брошенные деревни. 10 записок.', stat: () => '' },
  { id: 'tropa', name: 'ТРОПА', desc: 'Бесконечная тропа вдоль трассы. Туман, тополя, магазины с монетами.', stat: () => { const m = +ls('tropa_money') || 0; return m ? `🪙 ${m}` : ''; } },
  { id: 'vorota', name: 'ВОРОТА', desc: 'Дачный участок без конца. Найди ворота. Яблоки, груши, малина.', stat: () => { try { const f = JSON.parse(ls('vorota_fruit') || '{}'); const s = (f.apple || 0) + (f.pear || 0) + (f.plum || 0); return s || f.rasp ? `🍎 ${s} · малина ${f.rasp || 0}` : ''; } catch (e) { return ''; } } },
  { id: 'dom', name: 'ДОМ', desc: 'Тёмный дом без выхода. Двери, лестницы, мусор. Выход — в окно.', stat: () => { const t = +ls('dom_trash') || 0; return t ? `🗑 ${t}` : ''; } },
  { id: 'podezd', name: 'ПОДЪЕЗД', desc: 'Лестница вверх и вниз без конца. Стучи в двери — не откроют.', stat: () => { const t = +ls('podezd_trash') || 0; return t ? `🗑 ${t}` : ''; } },
  { id: 'garages', name: 'ГАРАЖИ', tag: 'ХОРРОР', url: 'garages/index.html', desc: 'Отдельная игра. Ночь, дождь, гаражный кооператив. Ты здесь не один — продержись как можно дольше.', stat: () => { const b = +ls('best') || 0; return b ? `⏱ ${Math.floor(b)} с` : ''; } },
  { id: 'zima', name: 'АНОМАЛЬНАЯ ЗИМА', desc: 'Метель, малиновое небо, фонари. Чужие следы куда-то ведут.', stat: its('zima', '🧤') },
  { id: 'ostanovka', name: 'ОСТАНОВКА', desc: 'Остановка с мозаикой каждые 300 м. ПАЗик увезёт — неизвестно куда.', stat: its('ostanovka', '🎫') },
  { id: 'shkola', name: 'ШКОЛА', desc: 'Коридоры, классы, «Наши отличники». Звонок звенит — никто не выходит.', stat: its('shkola', '🎒') },
  { id: 'bolnica', name: 'ПОЛИКЛИНИКА', desc: 'Кафель, кушетки, табло зовёт не тебя. Найди кабинет с талона.', stat: its('bolnica', '👟') },
  { id: 'metro', name: 'МЕТРО', desc: 'Пустая станция, люстры, мрамор. Поезд увезёт в другой мир.', stat: its('metro', '🪙') },
  { id: 'magazin', name: 'УНИВЕРСАМ', desc: 'Ночной магазин, гудят лампы. Собери всё по списку.', stat: its('magazin', '🛒') },
  { id: 'plyazh', name: 'ПЛЯЖ', desc: 'Осенняя Волга. Лодки, грибки, бутылки с записками. Вода — как зеркало.', stat: its('plyazh', '🐚') },
  { id: 'lager', name: 'ПИОНЕРЛАГЕРЬ', desc: 'Ночь, корпуса, гипсовый пионер. Горн из громкоговорителя.', stat: its('lager', '⭐') },
  { id: 'pole', name: 'ПОЛЕ', desc: 'Поле без края и одна ЛЭП. Будка трансформатора открыта.', stat: its('pole', '💠') },
  { id: 'elektrichka', name: 'ЭЛЕКТРИЧКА', desc: 'Бесконечный поезд. Каждая станция — другой мир.', stat: () => '' },
  { id: 'stroyka', name: 'СТРОЙКА', desc: 'Плиты, арматура, туман внизу. Упадёшь — проснёшься в подъезде.', stat: its('stroyka', '⛑') },
].map((w) => Object.assign({ url: w.id + '.html' }, w));
const KEYW = ['dvory', 'tishina', 'tropa', 'dom', 'podezd', 'ostanovka', 'shkola', 'bolnica', 'metro', 'magazin', 'plyazh', 'lager', 'pole', 'elektrichka', 'stroyka', 'zima'].filter((w) => w !== 'vorota');
function keysTxt() { let k = []; try { k = JSON.parse(ls('dream_keys') || '[]'); } catch (e) {} const n = KEYW.filter((w) => k.includes(w)).length; return ls('dream_done') ? 'ты проснулся · сон пройден' : `ключи от ворот: ${n} / ${KEYW.length}` + (n >= KEYW.length ? ' — ворота ждут' : ''); }
function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

const PAL = { dvory: ['#ff7a59', '#7b5cff'], tishina: ['#e8a96d', '#3d8ab8'], tropa: ['#b9d4a0', '#5a7a9a'], vorota: ['#d8e05a', '#e0566b'], dom: ['#d88a3a', '#4a3a9a'], podezd: ['#3fd8e0', '#2a5ad8'], garages: ['#ff3b3b', '#8a1aff'],
  zima: ['#ff4fc8', '#2be0e0'], ostanovka: ['#f0a030', '#3a6ad8'], shkola: ['#3a9ae8', '#e8c840'], bolnica: ['#5ae0c0', '#7ab0ff'], metro: ['#e8b84a', '#c82a3a'], magazin: ['#ff5a5a', '#ffd040'], plyazh: ['#4ac0f0', '#f0c890'], lager: ['#ff5040', '#4060c0'],
  pole: ['#f8c840', '#4aa0f0'], elektrichka: ['#4ae070', '#4ab0e0'], stroyka: ['#ff8a20', '#8a9aa8'] };
const pal = (id) => PAL[id] || ['#d9b45a', '#5a7ad9'], $ = (id) => document.getElementById(id), root = document.documentElement;
const strip = $('strip'), N = WORLDS.length;
// лента
WORLDS.forEach((w, i) => { const [a1, a2] = pal(w.id), t = document.createElement('div'); t.className = 't'; t.style.setProperty('--b1', a1); t.style.setProperty('--b2', a2); t.style.animationDelay = (0.25 + i * 0.04) + 's';
  t.innerHTML = `<div class="im" style="background-image:url(${IMG[w.id] || ''})"></div><span class="ix">${String(i + 1).padStart(2, '0')}</span><span class="nm">${w.name}</span>`;
  t.onclick = () => { if (sel === i) enter(i); else select(i, true); }; strip.appendChild(t); });
// прогресс ключей, Far Lands
function keysN() { let k = []; try { k = JSON.parse(ls('dream_keys') || '[]'); } catch (e) {} return KEYW.filter((w) => k.includes(w)).length; }
function refreshTop() { const n = keysN(), done = ls('dream_done'); $('ptxt').textContent = done ? 'СОН ПРОЙДЕН' : `КЛЮЧИ ${n} / ${KEYW.length}`; requestAnimationFrame(() => ($('pbar').style.transform = `scaleX(${done ? 1 : n / KEYW.length})`)); }
const far = $('far'); function farTxt() { const on = ls('farlands') === '1'; far.textContent = on ? 'FAR LANDS · ВКЛ' : 'FAR LANDS'; far.classList.toggle('on', on); }
far.onclick = () => { try { localStorage.setItem('farlands', ls('farlands') === '1' ? '0' : '1'); } catch (e) {} farTxt(); }; farTxt(); refreshTop();
// выбор мира
let sel = Math.max(0, WORLDS.findIndex((w) => w.id === ls('menu_last'))), flip = false;
function select(i, scroll) {
  sel = (i + N) % N; const w = WORLDS[sel], [a1, a2] = pal(w.id);
  [...strip.children].forEach((t, k) => t.classList.toggle('sel', k === sel));
  root.style.setProperty('--a1', a1); root.style.setProperty('--a2', a2);
  const A = flip ? $('bgA') : $('bgB'), B = flip ? $('bgB') : $('bgA'), TA = flip ? $('tA') : $('tB'), TB = flip ? $('tB') : $('tA'); flip = !flip;
  A.style.backgroundImage = `url(${BLUR[w.id] || IMG[w.id] || ''})`; A.classList.add('on'); B.classList.remove('on');
  TA.style.background = `radial-gradient(ellipse at 85% 15%,${a2}99,transparent 60%),radial-gradient(ellipse at 10% 95%,${a1}88,transparent 55%),linear-gradient(135deg,${a1}33,${a2}22)`; TA.classList.add('on'); TB.classList.remove('on');
  const hero = $('hero'); hero.classList.add('swap'); void hero.offsetWidth; hero.classList.remove('swap');
  $('hnum').innerHTML = `<b>${String(sel + 1).padStart(2, '0')}</b> / ${String(N).padStart(2, '0')}`; $('htag').textContent = w.tag || ''; $('hname').textContent = w.name; $('hdesc').textContent = w.desc; $('hstat').textContent = w.stat();
  if (scroll) strip.children[sel].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}
function enter(i) { const w = WORLDS[i]; if (document.body.classList.contains('go')) return; try { localStorage.setItem('menu_last', w.id); } catch (e) {}
  $('big').textContent = w.name; document.body.classList.add('go'); setTimeout(() => { location.href = w.url; }, 1150); }
$('go').onclick = () => enter(sel);
addEventListener('keydown', (e) => { if (e.code === 'ArrowRight' || e.code === 'ArrowDown') select(sel + 1, true); else if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') select(sel - 1, true); else if (e.code === 'Enter' || e.code === 'Space') enter(sel); });
strip.addEventListener('wheel', (e) => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { strip.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
if (matchMedia('(pointer:coarse)').matches) $('hint').textContent = 'листай миры · нажми ещё раз, чтобы войти';
select(sel, true);
// статичное зерно
{ const g = $('grain').getContext('2d'), im = g.createImageData(640, 360); for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); }
addEventListener('pageshow', () => { document.body.classList.remove('go'); refreshTop(); [...strip.children].forEach(() => {}); $('hstat').textContent = WORLDS[sel].stat(); });
</script>
</body></html>
