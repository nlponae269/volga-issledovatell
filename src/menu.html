<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Тишина</title>
<style>
:root{--ink:#e9e3d4;--dim:#9b9586;--acc:#d9b45a;--bg:#0b0c0b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:-6%;background-size:cover;background-position:center;filter:blur(14px) saturate(.7) brightness(.55);transform:scale(1.08);transition:background-image .8s}
#bg2{position:fixed;inset:-6%;background-size:cover;background-position:center;filter:blur(14px) saturate(.7) brightness(.55);opacity:0;transition:opacity .9s}
@keyframes drift{from{transform:scale(1.08) translate(-1.5%,0)}to{transform:scale(1.16) translate(1.5%,-1%)}}
.fog{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 20% 80%,rgba(200,205,210,.10),transparent 60%),radial-gradient(ellipse at 80% 30%,rgba(200,205,210,.08),transparent 55%);animation:fog 22s ease-in-out infinite alternate}
@keyframes fog{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.75) 100%)}
#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.05}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 0 max(12px,env(safe-area-inset-bottom))}
header{text-align:center;margin-bottom:clamp(10px,3vh,28px);padding:0 16px}
h1{margin:0;font-weight:300;letter-spacing:.42em;font-size:clamp(26px,6.2vh,58px);text-indent:.42em;text-shadow:0 4px 30px rgba(0,0,0,.8)}
.sub{color:var(--dim);font-size:clamp(11px,1.9vh,15px);letter-spacing:.18em;margin-top:6px;text-transform:lowercase}
#row{display:flex;gap:clamp(10px,1.6vw,22px);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:10px max(16px,calc(50vw - 600px)) 18px;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}
#row::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:clamp(170px,21vw,250px);scroll-snap-align:center;background:rgba(14,15,14,.72);border:1px solid rgba(255,255,255,.08);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s,opacity .25s;opacity:.78;position:relative;outline:none}
.card:hover,.card.sel{transform:translateY(-6px);border-color:rgba(217,180,90,.55);box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 0 1px rgba(217,180,90,.25);opacity:1}
.card .img{width:100%;aspect-ratio:16/9;background-size:cover;background-position:center;position:relative;filter:saturate(.85)}
.card .img::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,rgba(10,10,10,.85))}
.card .num{position:absolute;top:8px;left:10px;font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.55);z-index:1}
.card .body{padding:10px 12px 12px;margin-top:-30px;position:relative}
.card .name{font-size:clamp(15px,2.6vh,20px);letter-spacing:.22em;font-weight:600}
.card .tag{position:absolute;right:8px;top:8px;background:#c9a43a;color:#111;font:700 10px/1 system-ui;letter-spacing:2px;padding:4px 7px;border-radius:3px}
.card .desc{color:var(--dim);font-size:clamp(10px,1.7vh,12.5px);line-height:1.4;margin-top:5px;min-height:2.8em}
.card .stat{margin-top:8px;font-size:12px;color:var(--acc);letter-spacing:.04em;min-height:1.2em}
.card .go{position:absolute;right:12px;bottom:12px;font-size:12px;letter-spacing:.15em;color:var(--acc);opacity:0;transition:opacity .25s}
.card:hover .go,.card.sel .go{opacity:1}
footer{text-align:center;color:rgba(255,255,255,.32);font-size:11px;letter-spacing:.08em;margin-top:clamp(4px,1.5vh,14px);padding:0 16px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .7s}
@media (max-height:430px){.card .desc{display:none}.card{width:clamp(150px,26vw,210px)}.card .body{padding:8px 10px 10px}}

/* ===== градиентный дизайн меню ===== */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--c1:#d9b45a;--c2:#5a7ad9}
#mesh{position:fixed;inset:-20%;pointer-events:none;opacity:.5;transition:opacity 1s;contain:strict}
#mesh i{position:absolute;width:65vmax;height:65vmax;border-radius:50%;will-change:transform}
#mesh i:nth-child(1){left:-5%;top:10%;background:radial-gradient(circle,var(--c1),transparent 62%);animation:blob1 18s ease-in-out infinite alternate}
#mesh i:nth-child(2){right:-10%;top:-10%;background:radial-gradient(circle,var(--c2),transparent 62%);animation:blob2 22s ease-in-out infinite alternate}
#mesh i:nth-child(3){display:none;left:30%;bottom:-25%;background:radial-gradient(circle,color-mix(in srgb,var(--c1) 50%,var(--c2)),transparent 60%);animation:blob3 26s ease-in-out infinite alternate}
@keyframes blob1{to{transform:translate(25vw,10vh) scale(1.2)}}@keyframes blob2{to{transform:translate(-20vw,25vh) scale(.85)}}@keyframes blob3{to{transform:translate(-15vw,-20vh) scale(1.25)}}
#bg,#bg2{filter:blur(18px) saturate(.9) brightness(.42)!important}
.vig{background:radial-gradient(ellipse at center,transparent 30%,rgba(5,3,10,.85) 100%)!important}
h1{background:linear-gradient(100deg,#fff 0%,var(--c1) 30%,#fff 50%,var(--c2) 70%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:title 2.4s ease-out 1;text-shadow:none}
h1 .mL{background:inherit;-webkit-background-clip:text;background-clip:text}
@keyframes title{to{background-position:-250% 0}}
.sub#keys{background:linear-gradient(90deg,var(--c1),#fff,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent!important}
#far{border-image:none!important;background:linear-gradient(#0008,#0008) padding-box,linear-gradient(90deg,var(--c1),var(--c2)) border-box!important;border:1px solid transparent!important;border-radius:20px!important}
#row{perspective:1100px;padding-top:22px!important;padding-bottom:26px!important}
.card{background:linear-gradient(160deg,color-mix(in srgb,var(--a1) 22%,transparent),rgba(10,10,14,.55) 45%,color-mix(in srgb,var(--a2) 28%,transparent))!important;border:0!important;border-radius:18px!important;overflow:visible!important;
  transform:translateY(var(--ty,0)) scale(var(--s,1)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.9,.25,1.2),box-shadow .5s,filter .4s,opacity .4s!important;box-shadow:0 10px 30px rgba(0,0,0,.45)!important}
.card::after{content:"";position:absolute;inset:0;border-radius:18px;padding:1.5px;background:conic-gradient(from var(--ang),var(--a1),var(--a2),#fff8,var(--a1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.35;transition:opacity .4s;pointer-events:none;z-index:4}
@keyframes spin{to{--ang:360deg}}
.card .img{border-radius:17px 17px 0 0;overflow:hidden}
.card .img::after{background:linear-gradient(to bottom,transparent 35%,color-mix(in srgb,var(--a2) 35%,rgba(8,8,12,.9)))!important}
.card .holo{position:absolute;inset:0;border-radius:18px;pointer-events:none;z-index:3;opacity:0;transition:opacity .4s;
  background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.55),transparent 45%),linear-gradient(115deg,transparent 20%,var(--a1) 40%,var(--a2) 60%,transparent 80%);background-size:100% 100%,250% 250%;background-position:0 0,var(--mx,50%) var(--my,50%)}
.card.sel{--ty:-12px;--s:1.06;box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 50px color-mix(in srgb,var(--a1) 45%,transparent)!important}
.card.sel::after{opacity:1}.card.sel .holo{opacity:.22}
.card:hover{--ty:-8px}
.card:active{--s:.96}
.card .name{background:linear-gradient(90deg,#fff,var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent!important}
.card .stat{color:var(--a1)!important}
.card .go{color:#fff!important;background:linear-gradient(90deg,var(--a1),var(--a2));padding:5px 10px;border-radius:12px;font-weight:700;text-shadow:0 1px 3px #0006;transform:translateY(6px);transition:opacity .3s,transform .4s cubic-bezier(.2,.9,.25,1.3)!important}
.card.sel .go{transform:none}
.card .tag{background:linear-gradient(90deg,var(--a1),var(--a2))!important;color:#fff!important;text-shadow:0 1px 2px #0007}
/* переход в мир: картинка карточки раскрывается на весь экран */
#zoom{position:fixed;z-index:60;border-radius:18px;overflow:hidden;background-size:cover;background-position:center;pointer-events:none;transition:left .85s cubic-bezier(.75,0,.2,1),top .85s cubic-bezier(.75,0,.2,1),width .85s cubic-bezier(.75,0,.2,1),height .85s cubic-bezier(.75,0,.2,1),border-radius .85s,filter .5s}
#zoom::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--a1),transparent 45%,var(--a2));opacity:.45}
#zoom::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 20%,#000 85%)}
#zoom b{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%) scale(.6);opacity:0;text-align:center;z-index:2;font:300 clamp(30px,9vw,96px)/1 system-ui;letter-spacing:.35em;text-indent:.35em;
  background:linear-gradient(90deg,#fff,var(--a1),#fff,var(--a2),#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;transition:opacity .9s cubic-bezier(.16,1,.3,1) .35s,transform .9s cubic-bezier(.16,1,.3,1) .35s}
#zoom.full{inset:0!important;width:100%!important;height:100%!important;left:0!important;top:0!important;border-radius:0}
#zoom.full b{opacity:1;transform:translateY(-50%) scale(1);letter-spacing:.2em}
#zoom.dark{filter:brightness(0);transition:filter .5s ease-in}
@media (prefers-reduced-motion:reduce){#mesh i,h1,.card::after{animation:none!important}}
</style></head><body>
<div id="bg"></div><div id="bg2"></div><div id="mesh"><i></i><i></i><i></i></div><div class="fog"></div><canvas id="grain"></canvas><div class="vig"></div>
<div id="wrap">
  <header><h1>ТИШИНА</h1><div class="sub">выбери, куда проснуться</div><div class="sub" id="keys" style="color:#d9b45a;margin-top:4px"></div><button id="far" style="margin-top:8px;background:none;border:1px solid #666;color:#aaa;font:600 11px system-ui;letter-spacing:2px;padding:6px 12px;border-radius:14px;cursor:pointer"></button></header>
  <div id="row"></div>
  <footer>← → выбрать · Enter войти · из некоторых миров можно выпрыгнуть в окно</footer>
</div>
<div id="fade"></div>
<!--MUSIC-->
<script>
const IMG = /*THUMBS*/{};
const its = (w, ic) => () => { const n = +ls(w + '_items') || 0; return n ? `${ic} ${n}` : ''; };
const WORLDS = [
  { id: 'dvory', name: 'ДВОРЫ', tag: 'СЮЖЕТ', desc: '415-й микрорайон, Героев Тулы, 13. Ноябрь, 14:50, после дождя. Ключа нет, домофон молчит. Главная история.', stat: () => { const c = Math.min(12, +ls('dvory_cards') || 0), m = +ls('dvory_mand') || 0; return (c ? `✉ ${c}/12 ` : '') + (m ? `🌰 ${m}` : ''); } },
  { id: 'tishina', name: 'ТИШИНА', desc: 'Волга, осень, костёр. Горы, лес, брошенные деревни. 10 записок.', stat: () => '' },
  { id: 'tropa', name: 'ТРОПА', desc: 'Бесконечная тропа вдоль трассы. Туман, тополя, магазины с монетами.', stat: () => { const m = +ls('tropa_money') || 0; return m ? `🪙 ${m}` : ''; } },
  { id: 'vorota', name: 'ВОРОТА', desc: 'Дачный участок без конца. Найди ворота. Яблоки, груши, малина.', stat: () => { try { const f = JSON.parse(ls('vorota_fruit') || '{}'); const s = (f.apple || 0) + (f.pear || 0) + (f.plum || 0); return s || f.rasp ? `🍎 ${s} · малина ${f.rasp || 0}` : ''; } catch (e) { return ''; } } },
  { id: 'dom', name: 'ДОМ', desc: 'Тёмный дом без выхода. Двери, лестницы, мусор. Выход — в окно.', stat: () => { const t = +ls('dom_trash') || 0; return t ? `🗑 ${t}` : ''; } },
  { id: 'podezd', name: 'ПОДЪЕЗД', desc: 'Лестница вверх и вниз без конца. Стучи в двери — не откроют.', stat: () => { const t = +ls('podezd_trash') || 0; return t ? `🗑 ${t}` : ''; } },
  { id: 'garages', name: 'ГАРАЖИ', tag: 'ХОРРОР', url: 'garages/index.html', desc: 'Отдельная игра. Ночь, дождь, гаражный кооператив. Ты здесь не один — продержись как можно дольше.', stat: () => { const b = +ls('best') || 0; return b ? `⏱ ${Math.floor(b)} с` : ''; } },
  { id: 'zima', name: 'АНОМАЛЬНАЯ ЗИМА', desc: 'Метель, малиновое небо, фонари. Чужие следы куда-то ведут.', stat: its('zima', '🧤') },
  { id: 'ostanovka', name: 'ОСТАНОВКА', desc: 'Остановка с мозаикой каждые 300 м. ПАЗик увезёт — неизвестно куда.', stat: its('ostanovka', '🎫') },
  { id: 'shkola', name: 'ШКОЛА', desc: 'Коридоры, классы, «Наши отличники». Звонок звенит — никто не выходит.', stat: its('shkola', '🎒') },
  { id: 'bolnica', name: 'ПОЛИКЛИНИКА', desc: 'Кафель, кушетки, табло зовёт не тебя. Найди кабинет с талона.', stat: its('bolnica', '👟') },
  { id: 'metro', name: 'МЕТРО', desc: 'Пустая станция, люстры, мрамор. Поезд увезёт в другой мир.', stat: its('metro', '🪙') },
  { id: 'magazin', name: 'УНИВЕРСАМ', desc: 'Ночной магазин, гудят лампы. Собери всё по списку.', stat: its('magazin', '🛒') },
  { id: 'plyazh', name: 'ПЛЯЖ', desc: 'Осенняя Волга. Лодки, грибки, бутылки с записками. Вода — как зеркало.', stat: its('plyazh', '🐚') },
  { id: 'lager', name: 'ПИОНЕРЛАГЕРЬ', desc: 'Ночь, корпуса, гипсовый пионер. Горн из громкоговорителя.', stat: its('lager', '⭐') },
  { id: 'pole', name: 'ПОЛЕ', desc: 'Поле без края и одна ЛЭП. Будка трансформатора открыта.', stat: its('pole', '💠') },
  { id: 'elektrichka', name: 'ЭЛЕКТРИЧКА', desc: 'Бесконечный поезд. Каждая станция — другой мир.', stat: () => '' },
  { id: 'stroyka', name: 'СТРОЙКА', desc: 'Плиты, арматура, туман внизу. Упадёшь — проснёшься в подъезде.', stat: its('stroyka', '⛑') },
].map((w) => Object.assign({ url: w.id + '.html' }, w));
const KEYW = ['dvory', 'tishina', 'tropa', 'dom', 'podezd', 'ostanovka', 'shkola', 'bolnica', 'metro', 'magazin', 'plyazh', 'lager', 'pole', 'elektrichka', 'stroyka', 'zima'].filter((w) => w !== 'vorota');
function keysTxt() { let k = []; try { k = JSON.parse(ls('dream_keys') || '[]'); } catch (e) {} const n = KEYW.filter((w) => k.includes(w)).length; return ls('dream_done') ? 'ты проснулся · сон пройден' : `ключи от ворот: ${n} / ${KEYW.length}` + (n >= KEYW.length ? ' — ворота ждут' : ''); }
function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
document.getElementById('keys').textContent = keysTxt();
const farB = document.getElementById('far'); function farTxt() { const on = ls('farlands') === '1'; farB.textContent = on ? 'FAR LANDS: ВКЛ · край мира' : 'FAR LANDS: выкл'; farB.style.color = on ? '#ff9a7a' : '#aaa'; farB.style.borderColor = on ? '#ff9a7a' : '#666'; }
farB.onclick = (e) => { e.stopPropagation(); try { localStorage.setItem('farlands', ls('farlands') === '1' ? '0' : '1'); } catch (er) {} farTxt(); }; farTxt();
const row = document.getElementById('row'), bg = document.getElementById('bg'), bg2 = document.getElementById('bg2');
let sel = Math.max(0, WORLDS.findIndex((w) => w.id === ls('menu_last')));
WORLDS.forEach((w, i) => {
  const c = document.createElement('div'); c.className = 'card'; c.tabIndex = 0;
  c.innerHTML = `<div class="img" style="background-image:url(${IMG[w.id] || ''})"><span class="num">${String(i + 1).padStart(2, '0')}</span>${w.tag ? `<span class="tag">${w.tag}</span>` : ''}</div><div class="body"><div class="name">${w.name}</div><div class="desc">${w.desc}</div><div class="stat">${w.stat()}</div><div class="go">ВОЙТИ →</div></div>`;
  c.addEventListener('mouseenter', () => select(i)); c.addEventListener('focus', () => select(i));
  c.addEventListener('click', () => { if (sel !== i && matchMedia('(pointer:coarse)').matches) { select(i, true); } enter(i); });
  row.appendChild(c);
});
let swap = false;
function select(i, scroll) {
  sel = i; [...row.children].forEach((c, k) => c.classList.toggle('sel', k === i));
  const url = `url(${IMG[WORLDS[i].id] || ''})`; const top = swap ? bg : bg2, bot = swap ? bg2 : bg;
  top.style.backgroundImage = url; top.style.opacity = 1; bot.style.opacity = 0; swap = !swap;
  if (scroll) row.children[i].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}
bg.style.opacity = 1;
function enter(i) { const w = WORLDS[i]; try { localStorage.setItem('menu_last', w.id); } catch (e) {} document.getElementById('fade').style.opacity = 1; setTimeout(() => { location.href = w.url; }, 650); }
addEventListener('keydown', (e) => { if (e.code === 'ArrowRight') select(Math.min(WORLDS.length - 1, sel + 1), true); else if (e.code === 'ArrowLeft') select(Math.max(0, sel - 1), true); else if (e.code === 'Enter' || e.code === 'Space') enter(sel); });
row.addEventListener('wheel', (e) => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { row.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
select(sel, true);
if (matchMedia('(pointer:coarse)').matches) document.querySelector('footer').textContent = 'листай карточки · нажми, чтобы войти · ♪ — музыка';
// плёночное зерно
const gc = document.getElementById('grain'), gx = gc.getContext('2d'); gc.width = 200; gc.height = 120; const im = gx.createImageData(200, 120);
for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } gx.putImageData(im, 0, 0);
addEventListener('pageshow', () => { document.getElementById('fade').style.opacity = 0; document.getElementById('keys').textContent = keysTxt(); [...row.children].forEach((c, k) => { c.querySelector('.stat').textContent = WORLDS[k].stat(); }); });

const PAL = { dvory: ['#ff7a59', '#7b5cff'], kvartira: ['#ffb36b', '#6b8cff'], tishina: ['#e8a96d', '#3d8ab8'], tropa: ['#b9d4a0', '#5a7a9a'], vorota: ['#d8e05a', '#e0566b'], dom: ['#d88a3a', '#4a3a9a'], podezd: ['#3fd8e0', '#2a5ad8'], garages: ['#ff3b3b', '#8a1aff'],
  zima: ['#ff4fc8', '#2be0e0'], ostanovka: ['#f0a030', '#3a6ad8'], shkola: ['#3a9ae8', '#e8c840'], bolnica: ['#5ae0c0', '#7ab0ff'], metro: ['#e8b84a', '#c82a3a'], magazin: ['#ff5a5a', '#ffd040'], plyazh: ['#4ac0f0', '#f0c890'], lager: ['#ff5040', '#4060c0'],
  pole: ['#f8c840', '#4aa0f0'], elektrichka: ['#4ae070', '#4ab0e0'], stroyka: ['#ff8a20', '#8a9aa8'] };
const pal = (id) => PAL[id] || ['#d9b45a', '#5a7ad9'];
[...row.children].forEach((c, i) => { const [a1, a2] = pal(WORLDS[i].id); c.style.setProperty('--a1', a1); c.style.setProperty('--a2', a2); const h = document.createElement('div'); h.className = 'holo'; c.appendChild(h);
  let raf = 0; c.addEventListener('pointermove', (e) => { if (raf || e.pointerType === 'touch') return; raf = requestAnimationFrame(() => (raf = 0)); const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height; c.style.setProperty('--ry', ((x - 0.5) * 14) + 'deg'); c.style.setProperty('--rx', ((0.5 - y) * 12) + 'deg'); c.style.setProperty('--mx', x * 100 + '%'); c.style.setProperty('--my', y * 100 + '%'); });
  c.addEventListener('pointerleave', () => { c.style.setProperty('--rx', '0deg'); c.style.setProperty('--ry', '0deg'); }); });
