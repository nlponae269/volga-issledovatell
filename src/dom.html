<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ДОМ</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a0a09;font-family:system-ui,sans-serif;color:#eee;touch-action:none;user-select:none}
canvas{display:block}
#hud{position:fixed;top:12px;right:14px;font-size:22px;font-weight:700;text-shadow:0 2px 4px #000a}
#toast{position:fixed;top:46%;left:50%;transform:translate(-50%,-50%);font-size:20px;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff8}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:26px;color:#d33;text-align:center}
#start{background:#16181acc;position:fixed;inset:0;overflow-y:auto;touch-action:pan-y;background:#1b1d1ccc;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:16px}
#start h1{font-size:48px;margin:0 0 6px;letter-spacing:4px}
#start p{max-width:520px;opacity:.85;line-height:1.5}
.b{background:#c9a43a;color:#111;border:0;padding:12px 32px;font-size:18px;border-radius:4px;margin:6px;cursor:pointer}
.b2{background:#444;color:#eee}
#touch{display:none}
.tb{position:fixed;width:64px;height:64px;border-radius:50%;background:#0005;border:2px solid #fff6;color:#fff;font-size:24px}
#joy{position:fixed;left:30px;bottom:30px;width:120px;height:120px;border-radius:50%;background:#0003;border:2px solid #fff4}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#fff6}
</style></head><body>
<div id="hud" style="font-size:16px">🗑 мусор: <span id="f_trash">0</span></div><div id="prompt" style="position:fixed;left:50%;top:60%;transform:translateX(-50%);font-size:17px;color:#ddd;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .2s;pointer-events:none"></div><div id="cross"></div><div id="toast"></div>
<div id="touch"><div id="joy"><div id="knob"></div></div><button class="tb" id="tRun" style="right:30px;bottom:110px">🏃</button><button class="tb" id="tJump" style="right:30px;bottom:30px">⤒</button><button class="tb" id="tLight" style="right:110px;bottom:30px">🔦</button><button class="tb" id="tE" style="right:110px;bottom:110px;display:none">E</button></div>
<div id="fade"></div>
<div id="start"><h1>ДОМ</h1>
<p>Бесконечный дом. Коридоры, лестницы, двери. Темно — свети фонариком.</p>
<p>Собирай мусор. Выход отсюда только один — через окно во двор.</p>
<p style="font-size:13px;opacity:.6">WASD — ходьба, мышь — обзор, E — дверь / окно, F — фонарик, Shift — бег</p>
<div><button class="b" id="play" disabled>Загрузка…</button><button class="b b2" id="back">← Меню</button></div></div>
<script>window.WORLD="dom";</script>
<!--THREE-->
<!--GAME-->
</body></html>
