<style>
/* ===== Motion design: общий слой анимаций интерфейса (меню, заставки миров, HUD, подсказки) ===== */
:root{--spring:cubic-bezier(.2,.9,.25,1.25);--out:cubic-bezier(.16,1,.3,1)}
@keyframes mLetter{from{opacity:0;transform:translateY(.45em) scale(.9)}to{opacity:1;transform:none}}
@keyframes mRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes mPop{0%{opacity:0;transform:scale(.8)}70%{opacity:1;transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes mCard{from{opacity:0;transform:translateY(40px) rotateX(18deg) scale(.94)}to{opacity:1;transform:none}}
@keyframes mShine{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(230%) skewX(-18deg)}}
@keyframes mToast{0%{transform:translate(-50%,-50%) scale(.9)}60%{transform:translate(-50%,-50%) scale(1.03)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes mPrompt{from{transform:translate(-50%,10px);opacity:.2}to{transform:translateX(-50%);opacity:1}}
@keyframes mBump{0%{transform:scale(1)}35%{transform:scale(1.45);color:#ffd35a}100%{transform:scale(1)}}
@keyframes mPaper{0%{opacity:0;transform:perspective(700px) rotateX(-75deg) translateY(-30px) scale(.9)}65%{opacity:1;transform:perspective(700px) rotateX(8deg) rotate(-1deg)}100%{transform:perspective(700px) rotateX(0) rotate(-1deg)}}
@keyframes mFadeText{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}
@keyframes mBreath{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes mTag{0%,100%{box-shadow:0 0 0 0 rgba(201,164,58,.0)}50%{box-shadow:0 0 0 4px rgba(201,164,58,.25)}}
.mL{display:inline-block;opacity:0;animation:mLetter .9s var(--out) forwards;white-space:pre}
/* --- меню --- */
.mm header .sub,.mm header #far,.mm footer{opacity:0;animation:mRise .9s var(--out) forwards}
.mm header .sub{animation-delay:.55s}.mm header #keys{animation-delay:.7s}.mm header #far{animation-delay:.85s}.mm footer{animation-delay:1.4s}
.mm .card{animation:mCard .9s var(--out) backwards}
/* --- заставка мира --- */
.mw #start{transition:opacity .55s ease,transform .7s var(--out)}
.mw #start.mLeave{opacity:0;transform:scale(1.08);pointer-events:none}
.mw #start p,.mw #start>div:not(.sx){opacity:0;animation:mRise .9s var(--out) forwards}
.mw #start .b{animation:mPop .7s var(--spring) both;transition:transform .25s var(--spring),box-shadow .3s,background .3s}
.mw #start .b:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 8px 24px rgba(201,164,58,.35)}
.mw #start .b:active,.tb:active,#toggle:active{transform:scale(.9)!important;transition-duration:.08s}
.mw #start .b:disabled{animation:mPop .7s var(--spring) both}
.mw #toast.mT{animation:mToast .55s var(--spring)}
.mw #prompt.mP{animation:mPrompt .35s var(--out)}
.mw #hud span.mB{display:inline-block;animation:mBump .5s var(--spring)}
.mw #note[style*="flex"] p{animation:mPaper .7s var(--out)}
.mw #fade>*{animation:mFadeText 1.2s var(--out)}
.tb{transition:transform .2s var(--spring),background .2s,box-shadow .2s}
.tb:active{background:#fff3!important;box-shadow:0 0 18px rgba(255,255,255,.35)}
#knob{transition:transform .08s linear}

/* ===== стартовый экран мира (как у «Гаражей»): размытый фон мира, туман, свет, градиентное название, загрузка ===== */
body.st2 #start{background:#050506!important;align-items:flex-start!important;justify-content:center!important;text-align:left!important;padding:max(58px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(28px,env(safe-area-inset-left))!important;overflow:hidden!important}
body.st2 #start>*{position:relative;z-index:2}
body.st2 #start>.sx{position:absolute!important;z-index:0;pointer-events:none}
.sx.sbg{inset:-4%;background-size:cover;background-position:center;opacity:.55;animation:skb 30s ease-in-out infinite alternate;will-change:transform}
@keyframes skb{from{transform:scale(1.06) translate3d(-1.5%,0,0)}to{transform:scale(1.16) translate3d(1.5%,-1%,0)}}
.sx.stint{inset:0;background:radial-gradient(ellipse at 85% 10%,var(--a2),transparent 60%),radial-gradient(ellipse at 0% 100%,var(--a1),transparent 55%);opacity:.32}
.sx.sshade{inset:0;background:linear-gradient(90deg,rgba(4,4,6,.92),rgba(4,4,6,.55) 55%,rgba(4,4,6,.25)),linear-gradient(0deg,rgba(4,4,6,.85),transparent 45%)}
.sx.slamp{left:58%;top:-22%;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(closest-side,var(--a1),transparent 70%);opacity:.22;animation:slamp 7s steps(1) infinite}
@keyframes slamp{0%,100%{opacity:.22}46%{opacity:.22}47%{opacity:.05}48%{opacity:.2}49%{opacity:.02}51%{opacity:.22}83%{opacity:.22}84%{opacity:.08}85%{opacity:.22}}
.sx.sfog{left:0;width:200%;height:60%;background-repeat:repeat-x;background-size:50% 100%;will-change:transform;-webkit-mask-image:linear-gradient(180deg,transparent,#000 40%,#000 65%,transparent);mask-image:linear-gradient(180deg,transparent,#000 40%,#000 65%,transparent)}
.sx.f1{top:25%;opacity:.28;animation:sfog 64s linear infinite}.sx.f2{top:45%;opacity:.36;animation:sfog 36s linear infinite reverse}
@keyframes sfog{to{transform:translate3d(-50%,0,0)}}
.sx.srain{inset:-120px 0 0;background:repeating-linear-gradient(100deg,transparent 0 22px,rgba(200,210,230,.09) 22px 23px,transparent 23px 61px);background-size:120px 120px;animation:srain .45s linear infinite;will-change:transform}
@keyframes srain{to{transform:translate3d(-20px,120px,0)}}
.sx.ssnow{inset:-200px 0 0;background-image:radial-gradient(circle,rgba(255,255,255,.7) 1.2px,transparent 1.6px),radial-gradient(circle,rgba(255,255,255,.45) 1px,transparent 1.4px);background-size:90px 90px,140px 140px;background-position:0 0,40px 60px;animation:ssnow 9s linear infinite;will-change:transform}
@keyframes ssnow{to{transform:translate3d(-40px,200px,0)}}
.sx.sash{inset:-200px 0 0;background-image:radial-gradient(circle,rgba(220,214,200,.35) 1px,transparent 1.5px);background-size:110px 110px;animation:sash 26s linear infinite;will-change:transform}
@keyframes sash{to{transform:translate3d(60px,-200px,0)}}
.sx.svig{inset:0;background:radial-gradient(ellipse at 40% 50%,transparent 30%,rgba(0,0,0,.85) 100%)}
body.st2 #start h1{font-weight:800!important;font-size:clamp(34px,11vh,100px)!important;letter-spacing:.06em!important;line-height:.95;margin:0 0 10px!important;background:linear-gradient(180deg,#fff 0%,var(--a1) 55%,var(--a2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 22px rgba(0,0,0,.75));animation:sin 1.1s cubic-bezier(.16,1,.3,1) both,sflick 8s steps(1) 2.5s infinite!important}
@keyframes sin{from{opacity:0;clip-path:inset(0 100% 0 0);transform:translate3d(-24px,0,0)}to{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
@keyframes sflick{0%,100%{opacity:1;transform:none}70%{opacity:1}71%{opacity:.45;transform:translate3d(3px,0,0)}72%{opacity:1;transform:translate3d(-2px,0,0)}73%{transform:none}}
body.st2 #start p{max-width:min(560px,82vw)!important;margin:4px 0!important;color:rgba(240,234,224,.78);font-size:clamp(13px,2.3vh,16px);line-height:1.55;opacity:1!important}
body.st2 #start p b{color:var(--a1)}
body.st2 #start p.shint{position:absolute!important;right:max(20px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));max-width:44vw!important;text-align:right;font-size:11px!important;letter-spacing:.08em;color:rgba(240,234,224,.42)!important}
body.st2 #start .b{font:700 13px system-ui!important;letter-spacing:.28em;padding:15px 30px!important;border-radius:40px!important;margin:16px 12px 0 0!important;transition:transform .2s cubic-bezier(.2,.9,.25,1.3)!important}
body.st2 #play{color:#fff!important;background:linear-gradient(95deg,var(--a1),var(--a2))!important;box-shadow:0 10px 30px rgba(0,0,0,.45);text-transform:uppercase}
body.st2 #play:not(:disabled){animation:mPop .7s cubic-bezier(.2,.9,.25,1.3) both,spulse 2.4s ease-in-out 1s infinite!important}
body.st2 #play:disabled{opacity:.55;filter:saturate(.4)}
@keyframes spulse{0%,100%{box-shadow:0 10px 30px rgba(0,0,0,.45)}50%{box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 7px color-mix(in srgb,var(--a1) 28%,transparent)}}
body.st2 #back{border-radius:40px!important;padding:15px 26px!important;font:700 13px system-ui!important;letter-spacing:.2em}
body.st2 #back,body.st2 .b2{color:#eee!important;background:rgba(255,255,255,.07)!important;border:1px solid rgba(255,255,255,.18)!important}
body.st2 #start .b:active{transform:scale(.93)!important}
.sbar{width:min(320px,70vw);height:3px;margin-top:14px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;transition:opacity .6s}
.sbar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(.03);background:linear-gradient(90deg,var(--a2),var(--a1),#fff);transition:transform .4s ease}
.sbar.done{opacity:0}
/* «Тишина»: карточка заставки — прозрачная, слева */
body.st2 #start .card{background:transparent!important;border:0!important;box-shadow:none!important;text-align:left!important;padding:0!important;max-width:min(620px,86vw)!important}
body.st2 #start .card h1{font-size:clamp(34px,11vh,100px)!important}
body.st2 #play{border:0!important;border-radius:40px!important;padding:15px 30px!important;font:700 13px system-ui!important;letter-spacing:.28em!important}
body.st2 #start .card ul{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.mL,.mm header .sub,.mm footer,.mw #start p,.mw #start>div:not(.sx){opacity:1!important}}
</style>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches, $ = (s) => document.querySelector(s);
  // заголовок по буквам
  const letters = (el, d0, step) => { if (!el || reduce) return; const t = el.textContent; el.textContent = ''; [...t].forEach((ch, i) => { const s = document.createElement('span'); s.className = 'mL'; s.textContent = ch; s.style.animationDelay = (d0 + i * step) + 's'; el.appendChild(s); }); };
  const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
  if ($('#row')) { // ---------- меню ----------
    document.body.classList.add('mm'); letters($('header h1'), 0.1, 0.07);
    const cards = () => [...$('#row').children]; const go = () => cards().forEach((c, i) => { c.style.animationDelay = (0.35 + i * 0.06) + 's'; });
    go(); new MutationObserver(go).observe($('#row'), { childList: true });
    return; }
  if (!$('#start')) return;
  // ---------- заставка и интерфейс мира ----------
  document.body.classList.add('mw'); const st = $('#start');

  // ---------- новый стартовый экран ----------
  const PAL = { dvory: ['#ff7a59', '#7b5cff'], kvartira: ['#ffb36b', '#6b8cff'], tishina: ['#e8a96d', '#3d8ab8'], tropa: ['#b9d4a0', '#5a7a9a'], vorota: ['#d8e05a', '#e0566b'], dom: ['#d88a3a', '#4a3a9a'], podezd: ['#3fd8e0', '#2a5ad8'],
    zima: ['#ff4fc8', '#2be0e0'], ostanovka: ['#f0a030', '#3a6ad8'], shkola: ['#3a9ae8', '#e8c840'], bolnica: ['#5ae0c0', '#7ab0ff'], metro: ['#e8b84a', '#c82a3a'], magazin: ['#ff5a5a', '#ffd040'], plyazh: ['#4ac0f0', '#f0c890'], lager: ['#ff5040', '#4060c0'],
    pole: ['#f8c840', '#4aa0f0'], elektrichka: ['#4ae070', '#4ab0e0'], stroyka: ['#ff8a20', '#8a9aa8'] };
  const WID = window.WORLD || 'tishina', [a1, a2] = PAL[WID] || ['#d9b45a', '#5a7ad9'], WBG = /*WBG*/'';
  document.body.classList.add('st2'); document.documentElement.style.setProperty('--a1', a1); document.documentElement.style.setProperty('--a2', a2);
  const fx = WID === 'zima' ? 'ssnow' : ['dvory', 'tropa', 'ostanovka', 'plyazh', 'pole', 'tishina'].includes(WID) ? 'srain' : 'sash';
  const lay = ['sbg', 'stint', 'slamp', 'sfog f1', fx, 'sfog f2', 'sshade', 'svig'].map((c) => { const d = document.createElement('div'); d.className = 'sx ' + c; return d; });
  if (WBG) lay[0].style.backgroundImage = `url(${WBG})`; else lay[0].style.display = 'none';
  { const c = document.createElement('canvas'); c.width = 512; c.height = 256; const g = c.getContext('2d'); for (let i = 0; i < 60; i++) { const x = Math.random() * 512, y = 50 + Math.random() * 160, r = 40 + Math.random() * 110, gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(190,195,205,${0.1 + Math.random() * 0.12})`); gr.addColorStop(1, 'rgba(190,195,205,0)'); g.fillStyle = gr; for (const dx of [-512, 0, 512]) { g.save(); g.translate(dx, 0); g.fillRect(x - r, y - r, r * 2, r * 2); g.restore(); } }
    const u = `url(${c.toDataURL()})`; lay.forEach((d) => { if (d.classList.contains('sfog')) d.style.backgroundImage = u; }); }
  lay.reverse().forEach((d) => st.insertBefore(d, st.firstChild));
  st.querySelectorAll('p').forEach((p) => { if (/WASD/.test(p.textContent)) p.classList.add('shint'); });
  const play = $('#play'); if (play) { const bar = document.createElement('div'); bar.className = 'sbar'; bar.innerHTML = '<i></i>'; play.parentElement.after(bar);
    const upd = () => { const m = (play.textContent || '').match(/(\d+)%/); if (m) bar.firstChild.style.transform = `scaleX(${Math.max(0.03, m[1] / 100)})`; if (!play.disabled) { bar.firstChild.style.transform = 'scaleX(1)'; setTimeout(() => bar.classList.add('done'), 500); } };
    new MutationObserver(upd).observe(play, { childList: true, characterData: true, subtree: true, attributes: true }); upd(); }

  [...st.querySelectorAll('p, :scope > div')].forEach((el, i) => { el.style.animationDelay = (0.5 + i * 0.12) + 's'; });
  // старт: заставка растворяется вместо мгновенного исчезновения
  let busy = false; const mo = new MutationObserver(() => { if (busy) return; const hidden = st.style.display === 'none';
    if (hidden && !st.classList.contains('mLeave')) { busy = true; st.style.display = ''; st.classList.add('mLeave'); setTimeout(() => { st.style.display = 'none'; busy = false; }, 600); }
    else if (!hidden && st.classList.contains('mLeave') && st.style.display !== '') { st.classList.remove('mLeave'); } });
  mo.observe(st, { attributes: true, attributeFilter: ['style'] });
  const obs = (sel, fn, opt) => { const el = $(sel); if (el) new MutationObserver(() => fn(el)).observe(el, opt); };
  obs('#toast', (el) => { if (!reduce) restart(el, 'mT'); }, { childList: true, characterData: true, subtree: true });
  let lastP = ''; obs('#prompt', (el) => { if (el.textContent && el.textContent !== lastP && !reduce) restart(el, 'mP'); lastP = el.textContent; }, { childList: true, characterData: true, subtree: true });
  const hud = $('#hud'); if (hud) new MutationObserver((ms) => { if (reduce) return; for (const m of ms) { const sp = m.target.nodeType === 3 ? m.target.parentElement : m.target; if (sp && sp.tagName === 'SPAN' && sp.id !== 'f_clock' && sp.id !== 'f_floor' && !(sp._mt > performance.now() - 300)) { sp._mt = performance.now(); restart(sp, 'mB'); } } }).observe(hud, { childList: true, characterData: true, subtree: true });
})();
</script>
