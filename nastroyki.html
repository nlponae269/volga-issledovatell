<title>Настройки</title>
<style>
/* Мир «Настройки»: телефон, в котором меню настроек никогда не кончается. Анимации — только transform/opacity. */
:root{--bg:#0e1013;--card:#1a1d22;--card2:#22262c;--line:#ffffff12;--tx:#e9e7e2;--dim:#9aa0a8;--acc:#7ab0ff;--acc2:#5b8def;--on:#7ab0ff;--red:#ff4a4a}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#050607;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);user-select:none;-webkit-user-select:none}
#room{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#1c2230 0%,#08090c 70%);transition:opacity 2s}
#red{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#4a0a10 0%,#0a0203 70%);opacity:0;transition:opacity 3s}
#glow{position:fixed;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:radial-gradient(circle,#7ab0ff22,transparent 60%);pointer-events:none;animation:breath 6s ease-in-out infinite}
@keyframes breath{50%{opacity:.5;transform:scale(1.06)}}
#grain{position:fixed;inset:-20%;opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:gr 1s steps(5) infinite}
@keyframes gr{20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-4%)}60%{transform:translate(-4%,3%)}80%{transform:translate(3%,1%)}}
#menuBtn{position:fixed;left:16px;top:14px;z-index:5;background:#ffffff10;border:1px solid #ffffff22;color:#ddd;padding:9px 16px;border-radius:20px;font-size:14px;cursor:pointer}
#hint{position:fixed;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:#ffffff55;letter-spacing:.06em;pointer-events:none}
#phone{position:fixed;left:50%;top:50%;width:400px;height:min(840px,calc(100vh - 40px));transform:translate(-50%,-50%);border-radius:46px;background:#000;padding:11px;box-shadow:0 0 0 2px #2a2d33,0 0 0 9px #0b0c0e,0 30px 120px #000c,0 0 80px #7ab0ff18}
#scr{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg)}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:30}
@media (max-width:520px){#phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none}#scr{border-radius:0}#menuBtn,#hint{display:none}}
#sb{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600;z-index:20;padding-top:env(safe-area-inset-top,0px)}
#sb .ic{display:flex;gap:6px;align-items:center;font-size:12px}
#notch{position:absolute;left:50%;top:9px;width:96px;height:26px;margin-left:-48px;border-radius:14px;background:#000;z-index:21}
@media (max-width:520px){#notch{display:none}}
.pg{position:absolute;inset:40px 0 0 0;display:flex;flex-direction:column;background:var(--bg);transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .38s;will-change:transform}
.pg.in{transform:translateX(100%)}.pg.out{transform:translateX(-28%);opacity:.0}.pg.back{transform:translateX(100%)}
.hd{flex:none;padding:10px 14px 8px}
.hd .row{display:flex;align-items:center;gap:6px;height:44px}
.hd button{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--tx);font-size:22px;cursor:pointer}
.hd button:active{background:var(--card2)}
.hd h1{font-size:30px;font-weight:600;margin:8px 8px 4px;line-height:1.1;letter-spacing:-.01em;word-break:break-word}
.hd .crumb{margin:0 8px;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch{margin:8px 8px 0;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:24px;padding:0 16px;height:44px}
.srch input{flex:1;background:none;border:0;outline:0;color:var(--tx);font-size:15px}
.ls{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 12px 40px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.ls::-webkit-scrollbar{display:none}
.gh{font-size:12.5px;color:var(--acc);font-weight:600;margin:18px 10px 6px;letter-spacing:.02em}
.grp{background:var(--card);border-radius:22px;overflow:hidden}
.it{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.it:last-child{border-bottom:0}
.it:active,.it.foc{background:var(--card2)}
.it .ico{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px}
.it .tx{flex:1;min-width:0}
.it .t{font-size:16px;line-height:1.25;word-break:break-word}
.it .s{font-size:12.5px;color:var(--dim);margin-top:2px;line-height:1.3;word-break:break-word}
.it .ch{color:var(--dim);font-size:18px}
.it .v{color:var(--dim);font-size:13px;white-space:nowrap}

.sw::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#e9e7e2;transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--on)}.sw.on::after{transform:translateX(20px);background:#fff}
.sl{width:100%;margin-top:10px;accent-color:var(--acc)}
.rd{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--dim);position:relative}
.rd.on{border-color:var(--acc)}.rd.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--acc)}
.more{text-align:center;color:var(--dim);font-size:12px;padding:18px}
#toast{position:absolute;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;background:#2b2f36ee;color:#eee;padding:11px 18px;border-radius:20px;font-size:13.5px;max-width:86%;text-align:center;z-index:40;transition:transform .3s,opacity .3s;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
#notif{position:absolute;left:10px;right:10px;top:46px;z-index:41;background:#2a2e35f2;color:#eee;border-radius:22px;padding:12px 16px;display:flex;gap:12px;align-items:center;transform:translateY(-140%);transition:transform .5s cubic-bezier(.2,.9,.2,1);box-shadow:0 10px 30px #0008;cursor:pointer}
#notif.on{transform:none}
#notif .ni{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
#notif b{display:block;font-size:13px}#notif span{font-size:13.5px;opacity:.85}
#dlg{position:absolute;inset:0;z-index:50;background:#000a;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
#dlg.on{opacity:1;pointer-events:auto}
#dlg .bx{width:84%;background:var(--card);border-radius:28px;padding:24px 22px 14px;transform:scale(.92);transition:transform .3s cubic-bezier(.2,1.3,.4,1)}
#dlg.on .bx{transform:none}
#dlg h3{font-size:20px;font-weight:600;margin-bottom:12px}
#dlg p{font-size:14.5px;line-height:1.55;color:var(--dim);white-space:pre-line}
#dlg .bt{display:flex;justify-content:flex-end;gap:6px;margin-top:18px}
#dlg button{background:none;border:0;color:var(--acc);font-size:15px;font-weight:600;padding:10px 14px;border-radius:18px;cursor:pointer}
#dlg button:active{background:var(--card2)}
.gl .t{animation:gl 2.6s steps(1) infinite}
@keyframes gl{0%,92%{transform:none;opacity:1}93%{transform:translateX(3px);opacity:.6}95%{transform:translateX(-4px)}97%{opacity:.3}}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:99;transition:opacity .9s;display:grid;place-items:center;color:#bbb;font-size:18px}
</style></head><body>
