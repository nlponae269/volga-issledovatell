<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Гаражи</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{pointer-events:none}
  #status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#cfc8bf;font:20px sans-serif;background:#000;z-index:5}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="status">Загрузка…</div>
<style>#tomenu{transition:transform .25s cubic-bezier(.2,.9,.25,1.25),background .2s;animation:tmIn .8s cubic-bezier(.16,1,.3,1) both}#tomenu:active{transform:scale(.9);background:#fff3!important}@keyframes tmIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}</style>
<a id="tomenu" href="../index.html" style="position:fixed;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));z-index:20;color:#cfc8bf;background:#0007;border:1px solid #fff3;border-radius:16px;padding:6px 12px;font:13px sans-serif;text-decoration:none">← Меню</a>
<script type="module" src="./src/main.js"></script>

<style>
/* ===== меню и загрузка «Гаражей» ===== */
#gm{position:fixed;inset:0;z-index:30;overflow:hidden;background:radial-gradient(ellipse at 70% 0%,#2a1612 0%,#0d0b0c 55%,#050506 100%);color:#e8e0d4;font-family:system-ui,sans-serif;transition:opacity .9s ease,transform 1.1s cubic-bezier(.16,1,.3,1)}
#gm.out{opacity:0;transform:scale(1.15);pointer-events:none}
#gm .lamp{position:absolute;left:62%;top:-18%;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(255,170,90,.35),rgba(255,120,60,.08) 55%,transparent);animation:lamp 6s steps(1) infinite;will-change:opacity}
@keyframes lamp{0%,100%{opacity:1}41%{opacity:1}42%{opacity:.25}43%{opacity:.9}44%{opacity:.1}46%{opacity:1}78%{opacity:1}79%{opacity:.4}80%{opacity:1}}
#gm .doors{position:absolute;left:0;right:0;bottom:0;height:46%;background:repeating-linear-gradient(90deg,#141214 0 3px,#1d1a1b 3px 118px,#0b0a0b 118px 124px),linear-gradient(180deg,transparent,#000);opacity:.9;-webkit-mask-image:linear-gradient(0deg,#000 55%,transparent);mask-image:linear-gradient(0deg,#000 55%,transparent)}
#gm .doors::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px)}
#gm .doors::after{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:#0a0909}
#gm .fg{position:absolute;left:0;width:200%;height:60%;background-repeat:repeat-x;background-size:50% 100%;will-change:transform;-webkit-mask-image:linear-gradient(180deg,transparent,#000 40%,#000 65%,transparent);mask-image:linear-gradient(180deg,transparent,#000 40%,#000 65%,transparent)}
#gm .g1{top:30%;opacity:.3;animation:gfog 60s linear infinite}#gm .g2{top:48%;opacity:.4;animation:gfog 34s linear infinite reverse}
@keyframes gfog{to{transform:translate3d(-50%,0,0)}}
#gm .rain{position:absolute;inset:-100px 0 0;background:repeating-linear-gradient(100deg,transparent 0 22px,rgba(190,205,225,.10) 22px 23px,transparent 23px 61px);background-size:120px 120px;animation:grain .45s linear infinite;will-change:transform;opacity:.7}
@keyframes grain{to{transform:translate3d(-20px,100px,0)}}
#gm .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 40% 50%,transparent 30%,rgba(0,0,0,.9) 100%)}
#gm .box{position:absolute;left:max(24px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);max-width:min(560px,80vw)}
#gm h1{margin:0;font-weight:800;font-size:clamp(46px,14vh,120px);letter-spacing:.08em;line-height:.95;background:linear-gradient(180deg,#f2e6d6 0%,#c9a27a 45%,#7a2a1a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 20px rgba(0,0,0,.8));animation:gin 1.2s cubic-bezier(.16,1,.3,1) both,gflick 7s steps(1) 2s infinite}
@keyframes gin{from{opacity:0;transform:translate3d(-30px,0,0) skewX(-6deg)}}
@keyframes gflick{0%,100%{opacity:1;transform:none}60%{opacity:1}61%{opacity:.4;transform:translate3d(3px,0,0)}62%{opacity:1;transform:translate3d(-2px,0,0)}63%{transform:none}}
#gm .sub{margin-top:10px;color:rgba(232,224,212,.7);font-size:clamp(13px,2.4vh,16px);line-height:1.6;animation:gin 1.2s cubic-bezier(.16,1,.3,1) .15s both}
#gm .sub b{color:#ff8a5a;font-weight:600}
#gm .load{margin-top:22px;animation:gin 1s ease .3s both}
#gm .bar{width:min(320px,70vw);height:3px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
#gm .bar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#7a2a1a,#ff8a3a,#ffd2a0);transition:transform .4s ease}
#gm .st{margin-top:8px;font-size:11px;letter-spacing:.2em;color:rgba(232,224,212,.5);text-transform:uppercase}
#gm .btns{display:none;gap:12px;margin-top:22px;flex-wrap:wrap}
#gm.ready .btns{display:flex}#gm.ready .load{display:none}
#gm .btns button,#gm .btns a{font:700 13px system-ui;letter-spacing:.28em;padding:15px 30px;border-radius:40px;border:0;cursor:pointer;text-decoration:none;animation:gpop .7s cubic-bezier(.2,.9,.25,1.3) both;transition:transform .2s cubic-bezier(.2,.9,.25,1.3)}
#gm .play{color:#fff;background:linear-gradient(95deg,#b8341c,#ff7a3a);box-shadow:0 10px 30px rgba(180,50,20,.45);animation:gpop .7s cubic-bezier(.2,.9,.25,1.3) both,gpulse 2.4s ease-in-out 1s infinite!important}
#gm .back{color:#e8e0d4;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18)!important;animation-delay:.1s!important}
#gm .btns button:active,#gm .btns a:active{transform:scale(.93)}
@keyframes gpop{from{opacity:0;transform:translate3d(0,14px,0) scale(.92)}}
@keyframes gpulse{0%,100%{box-shadow:0 10px 30px rgba(180,50,20,.45)}50%{box-shadow:0 10px 30px rgba(180,50,20,.45),0 0 0 7px rgba(255,120,60,.18)}}
#gm .best{margin-top:16px;font-size:12px;letter-spacing:.18em;color:#ffb48a;opacity:0;transition:opacity .6s}
#gm.ready .best:not(:empty){opacity:1}
#gm .tips{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));font-size:11px;letter-spacing:.12em;color:rgba(232,224,212,.4);text-align:right;line-height:1.7}
#gm .eyes{position:absolute;right:22%;bottom:30%;width:26px;height:6px;opacity:0;background:radial-gradient(circle at 3px 3px,#ff3a2a 2px,transparent 3px),radial-gradient(circle at 23px 3px,#ff3a2a 2px,transparent 3px);filter:drop-shadow(0 0 4px #f00)}
#gm .eyes.on{animation:eyes 3.2s ease-in-out}
@keyframes eyes{0%{opacity:0}20%{opacity:.9}45%{opacity:.9}48%{opacity:0}52%{opacity:.8}100%{opacity:0}}
#status{opacity:0!important}
#tomenu{display:none}
body.gplay #tomenu{display:block}
@media (prefers-reduced-motion:reduce){#gm *{animation:none!important}}
</style>
<div id="gm"><div class="lamp"></div><div class="fg g1"></div><div class="doors"></div><div class="fg g2"></div><div class="eyes"></div><div class="rain"></div><div class="vig"></div>
  <div class="box"><h1>ГАРАЖИ</h1><div class="sub">Кооператив за школой. Ночь, дождь, ни души.<br><b>Здесь кто-то есть.</b> Не попадайся ему на глаза — бег и фонарь выдают тебя.</div>
    <div class="load"><div class="bar"><i id="gbar"></i></div><div class="st" id="gst">загрузка</div></div>
    <div class="btns"><button class="play" id="gplay">ИГРАТЬ</button><a class="back" href="../index.html">← В МЕНЮ</a></div><div class="best" id="gbest"></div></div>
  <div class="tips" id="gtips">WASD — ходьба · мышь — обзор<br>Shift — бег · F — фонарь</div></div>
<script>
(() => {
  const gm = document.getElementById('gm'), st = document.getElementById('status'), bar = document.getElementById('gbar'), gs = document.getElementById('gst');
  // туман: текстура рисуется один раз
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const g = c.getContext('2d');
  for (let i = 0; i < 60; i++) { const x = Math.random() * 512, y = 50 + Math.random() * 160, r = 40 + Math.random() * 110, gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(170,175,185,${0.1 + Math.random() * 0.12})`); gr.addColorStop(1, 'rgba(170,175,185,0)'); g.fillStyle = gr; for (const dx of [-512, 0, 512]) { g.save(); g.translate(dx, 0); g.fillRect(x - r, y - r, r * 2, r * 2); g.restore(); } }
  const u = `url(${c.toDataURL()})`; gm.querySelectorAll('.fg').forEach((e) => (e.style.backgroundImage = u));
  if (matchMedia('(pointer:coarse)').matches) document.getElementById('gtips').innerHTML = 'левая половина — ходьба · правая — обзор<br>кнопки на экране — бег и фонарь';
  // прогресс загрузки берём из строки статуса игры
  let pct = 0; const sync = () => { const t = st.textContent || ''; const m = t.match(/(\d+)%/); if (m) pct = Math.max(pct, +m[1] / 100 * 0.85); else if (/Строю/.test(t)) pct = Math.max(pct, 0.92); else if (/Синтез/.test(t)) pct = Math.max(pct, 0.04);
    bar.style.transform = `scaleX(${pct})`; gs.textContent = t.replace('…', '').replace(/\d+%/, '').trim() || 'загрузка';
    if (st.style.display === 'none') { bar.style.transform = 'scaleX(1)'; setTimeout(() => gm.classList.add('ready'), 350); } };
  new MutationObserver(sync).observe(st, { childList: true, characterData: true, subtree: true, attributes: true }); sync();
  try { const b = +localStorage.getItem('best') || 0; if (b) document.getElementById('gbest').textContent = `РЕКОРД  ${Math.floor(b / 60)}:${String(Math.floor(b % 60)).padStart(2, '0')}`; } catch (e) {}
  // иногда в темноте между гаражами вспыхивают глаза
  const eyes = gm.querySelector('.eyes'); const blink = () => { if (gm.classList.contains('out')) return; eyes.style.right = (10 + Math.random() * 40) + '%'; eyes.style.bottom = (24 + Math.random() * 12) + '%'; eyes.classList.remove('on'); void eyes.offsetWidth; eyes.classList.add('on'); setTimeout(blink, 9000 + Math.random() * 12000); };
  setTimeout(blink, 5000);
  document.getElementById('gplay').onclick = () => { const G = window.__game; if (!G) return; const cv = document.getElementById('gl');
    if (!matchMedia('(pointer:coarse)').matches && cv.requestPointerLock) try { cv.requestPointerLock(); } catch (e) {}
    gm.classList.add('out'); document.body.classList.add('gplay'); setTimeout(() => { if (G.phase === 'menu') G.startGame(); }, 250); setTimeout(() => (gm.style.display = 'none'), 1200); };
})();
</script>
</body>
</html>
